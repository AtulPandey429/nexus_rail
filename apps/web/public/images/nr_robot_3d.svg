<svg viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg" width="500" height="470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="blue" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#6f9bff"/><stop offset="0.45" stop-color="#2b4fc4"/><stop offset="1" stop-color="#14237a"/>
    </radialGradient>
    <radialGradient id="orange" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#ffc07a"/><stop offset="0.5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#b9400a"/>
    </radialGradient>
    <radialGradient id="grey" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#b9bec9"/><stop offset="0.5" stop-color="#5a6070"/><stop offset="1" stop-color="#262a35"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a3d"/><stop offset="1" stop-color="#050a1e"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2f78"/><stop offset="1" stop-color="#0a1442"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc4ff" stop-opacity="0.85"/><stop offset="1" stop-color="#2a5fc9" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9edf3"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="500" height="470" fill="url(#bg)"/>

  <!-- orbit particles -->
  <g fill="none" stroke="#ff8a2a" stroke-width="1.2" opacity="0.9">
    <ellipse cx="155" cy="38" rx="32" ry="10" transform="rotate(-15 155 38)"/>
    <ellipse cx="330" cy="45" rx="32" ry="10" transform="rotate(20 330 45)" stroke="#3a7bff"/>
  </g>
  <circle cx="170" cy="17" r="4" fill="#ff7a1a"/><circle cx="125" cy="48" r="3" fill="#3a7bff"/>
  <circle cx="350" cy="30" r="3.5" fill="#3a7bff"/><circle cx="298" cy="52" r="3" fill="#ff7a1a"/>

  <!-- platform -->
  <ellipse cx="232" cy="418" rx="130" ry="30" fill="url(#floor)"/>
  <ellipse cx="232" cy="408" rx="118" ry="26" fill="url(#grey)"/>
  <ellipse cx="232" cy="398" rx="118" ry="26" fill="#8a909e"/>
  <ellipse cx="232" cy="392" rx="112" ry="24" fill="url(#glass)" stroke="#d8e8ff" stroke-width="1.5"/>
  <ellipse cx="232" cy="380" rx="95" ry="20" fill="none" stroke="#ff8a2a" stroke-width="3" opacity="0.9"/>
  <ellipse cx="240" cy="345" rx="95" ry="26" fill="none" stroke="#5b8be6" stroke-width="5" opacity="0.55" transform="rotate(-8 240 345)"/>
  <ellipse cx="240" cy="345" rx="95" ry="26" fill="none" stroke="#ff8a2a" stroke-width="2.5" transform="rotate(-8 240 345)" stroke-dasharray="180 120"/>

  <g filter="url(#soft)">
    <!-- legs -->
    <path d="M198 292 L238 292 L232 345 L205 345 Z" fill="url(#grey)"/>
    <path d="M240 292 L282 288 L276 340 L248 342 Z" fill="url(#grey)"/>
    <rect x="198" y="318" width="38" height="14" rx="6" fill="url(#blue)"/>
    <rect x="244" y="314" width="36" height="14" rx="6" fill="url(#blue)"/>
    <ellipse cx="213" cy="352" rx="22" ry="12" fill="url(#blue)"/>
    <ellipse cx="213" cy="356" rx="22" ry="8" fill="#14237a" opacity="0.5"/>
    <ellipse cx="268" cy="348" rx="21" ry="12" fill="url(#blue)"/>

    <!-- left arm (thumbs up) -->
    <path d="M178 205 L130 175 L118 200 L168 232 Z" fill="url(#orange)"/>
    <circle cx="176" cy="215" r="17" fill="url(#grey)"/>
    <rect x="76" y="170" width="52" height="38" rx="14" fill="url(#blue)" transform="rotate(-15 100 190)"/>
    <rect x="88" y="140" width="16" height="42" rx="8" fill="url(#blue)" transform="rotate(-8 96 160)"/>
    <g stroke="#14237a" stroke-width="1.5" opacity="0.5"><path d="M82 186 L118 196"/><path d="M80 198 L114 206"/></g>
    <ellipse cx="94" cy="150" rx="4" ry="9" fill="#9bb8ff" opacity="0.7"/>

    <!-- torso -->
    <path d="M178 200 Q228 188 282 205 L276 268 Q228 282 184 268 Z" fill="url(#blue)"/>
    <path d="M190 205 Q228 197 262 208" stroke="#9bb8ff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
    <circle cx="208" cy="224" r="12" fill="#10163a" stroke="#cfd6e8" stroke-width="2"/>
    <path d="M208 217 V224 M203 220 A7 7 0 1 0 213 220" stroke="#ff7a1a" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="262" cy="220" r="5" fill="#ff8a2a" filter="url(#glow)"/>
    <path d="M184 262 Q230 280 278 266 L274 290 Q228 304 188 290 Z" fill="url(#orange)"/>

    <!-- right arm -->
    <circle cx="284" cy="228" r="17" fill="url(#grey)"/>
    <path d="M280 235 L312 245 L318 285 L292 292 Z" fill="url(#orange)"/>
    <ellipse cx="305" cy="300" rx="18" ry="14" fill="url(#blue)" transform="rotate(20 305 300)"/>
    <path d="M298 310 L316 318" stroke="#9bb8ff" stroke-width="3" stroke-linecap="round"/>

    <!-- neck -->
    <rect x="200" y="178" width="40" height="20" rx="8" fill="url(#grey)"/>

    <!-- antenna fins -->
    <path d="M148 95 L152 28 L168 78 Z" fill="url(#blue)"/>
    <path d="M300 78 L330 40 L322 112 Z" fill="url(#blue)"/>

    <!-- headphones -->
    <rect x="128" y="88" width="34" height="68" rx="16" fill="url(#blue)"/>
    <rect x="286" y="92" width="34" height="68" rx="16" fill="url(#blue)"/>
    <rect x="135" y="104" width="14" height="36" rx="7" fill="#9bb8ff" opacity="0.35"/>

    <!-- helmet -->
    <rect x="148" y="48" width="152" height="148" rx="48" fill="url(#grey)"/>
    <path d="M168 58 Q224 44 284 60" stroke="#fff" stroke-width="3" opacity="0.5" fill="none" stroke-linecap="round"/>
    <!-- top visor with NR -->
    <rect x="162" y="52" width="124" height="46" rx="18" fill="url(#visor)" stroke="#6f7790" stroke-width="2"/>
    <text x="224" y="86" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="34" fill="#ff8a2a" filter="url(#glow)">NR</text>
    <!-- face screen -->
    <rect x="160" y="100" width="128" height="80" rx="30" fill="url(#screen)" stroke="#3a4055" stroke-width="3"/>
    <g filter="url(#glow)" stroke="#33d6ff" fill="none" stroke-linecap="round">
      <circle cx="194" cy="132" r="9" fill="#33d6ff" stroke="none"/>
      <path d="M232 134 Q244 120 256 132" stroke-width="4"/>
      <path d="M205 152 Q224 166 244 152" stroke-width="4"/>
      <path d="M176 118 L186 110 M264 118 L274 112 M176 150 L186 144" stroke-width="1.5" opacity="0.8"/>
    </g>
    <g fill="#33d6ff"><circle cx="176" cy="118" r="2.5"/><circle cx="264" cy="118" r="2.5"/><circle cx="178" cy="150" r="2.5"/><circle cx="270" cy="150" r="2.5"/></g>
    <ellipse cx="190" cy="108" rx="24" ry="5" fill="#fff" opacity="0.12"/>
  </g>
</svg>
