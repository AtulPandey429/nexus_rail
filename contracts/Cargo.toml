[workspace]
resolver = "2"
members = [
    "nexus_vault",
    "nexus_swap",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["NexusRail Core Architecture Team"]
publish = false

[workspace.dependencies]
soroban-sdk = { version = "22.0.8", default-features = false }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
