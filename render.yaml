services:
  - type: web
    name: nexusrail-api
    env: node
    buildCommand: npm install && npm run build:backend
    startCommand: npm run start:backend
    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
        - render.yaml
      ignoredPaths:
        - frontend/**
        - docs/**
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
